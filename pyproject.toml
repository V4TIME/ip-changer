[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ip-changer"
version = "1.0.1"
description = "Rotate the Tor exit IP from a terminal or Termux control panel"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "IP Changer contributors" }]
keywords = ["tor", "privacy", "termux", "cli", "tui", "socks5"]
classifiers = [
    "Environment :: Console :: Curses",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Topic :: Security",
    "Topic :: System :: Networking",
]
dependencies = []

[project.scripts]
ipchanger = "ipchanger.cli:main"

[project.urls]
Homepage = "https://github.com/V4TIME/ip-changer"
Documentation = "https://github.com/V4TIME/ip-changer/blob/main/docs/ARCHITECTURE.md"

[tool.setuptools]
packages = ["ipchanger"]

[tool.setuptools.package-data]
ipchanger = ["py.typed"]
