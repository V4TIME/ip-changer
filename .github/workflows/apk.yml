name: apk

on:
  push:
    paths:
      - "noteapp/**"
      - ".github/workflows/apk.yml"
  workflow_dispatch:

# Needed only to attach build diagnostics to the commit as a comment, because
# the raw job log requires repository admin rights to download.
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Python 3.11: python-for-android's build venv is broken on 3.14
      # (the kivy/buildozer image now ships 3.14 and fails at `pip -U pip`).
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # The SDK/NDK download is reused across runs. noteapp/.buildozer is
      # deliberately not cached: a half-built venv there is worse than a rebuild.
      - name: Cache Android SDK and NDK
        uses: actions/cache@v4
        with:
          path: ~/.buildozer/android/platform
          key: android-platform-${{ runner.os }}-${{ hashFiles('noteapp/buildozer.spec') }}
          restore-keys: |
            android-platform-${{ runner.os }}-

      - name: System dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            git zip unzip openjdk-17-jdk-headless \
            autoconf automake libtool pkg-config \
            zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 \
            cmake libffi-dev libssl-dev libltdl-dev

      - name: Install Buildozer
        run: |
          python -m pip install --upgrade pip
          python -m pip install "cython<3.0" buildozer

      # The image's default java is 11; the Android Gradle plugin used by
      # python-for-android refuses anything below 17.
      - name: Use JDK 17
        run: |
          JDK="${JAVA_HOME_17_X64:-/usr/lib/jvm/temurin-17-jdk-amd64}"
          if [ ! -x "$JDK/bin/javac" ]; then
            JDK=/usr/lib/jvm/java-17-openjdk-amd64
          fi
          test -x "$JDK/bin/javac"
          echo "JAVA_HOME=$JDK" >> "$GITHUB_ENV"
          "$JDK/bin/java" -version

      - name: Build debug APK
        working-directory: noteapp
        env:
          # Forces the pure-Python wheel for charset-normalizer; see the file.
          PIP_CONSTRAINT: ${{ github.workspace }}/noteapp/pip-constraints.txt
        run: |
          set -o pipefail
          buildozer -v android debug 2>&1 | tee build.log

      - name: Collect APK
        if: success()
        run: |
          mkdir -p out
          cp noteapp/bin/*.apk out/
          ls -lh out

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: pixnote-debug-apk
          path: out/*.apk
          if-no-files-found: error

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: buildozer-log
          path: noteapp/build.log
          if-no-files-found: ignore

      # Buildozer dumps every environment variable on failure, which buries the
      # actual traceback. Keep the error lines and the tail of the real output.
      - name: Summarise failure
        if: failure()
        run: |
          if [ -f noteapp/build.log ]; then
            python3 scripts/apk_diagnostics.py noteapp/build.log > /tmp/diag.txt
          else
            echo "no build.log was produced" > /tmp/diag.txt
          fi
          tail -c 4000 /tmp/diag.txt

      - name: Publish failure diagnostics
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let text = 'APK build failed on ' + context.sha + '\n\n```\n';
            try {
              text += fs.readFileSync('/tmp/diag.txt', 'utf8');
            } catch (error) {
              text += 'no diagnostics file: ' + error.message;
            }
            text += '\n```';
            if (text.length > 60000) text = text.slice(0, 60000) + '\n... truncated\n```';
            await github.rest.repos.createCommitComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              commit_sha: context.sha,
              body: text,
            });
