name: apk

on:
  push:
    paths:
      - "noteapp/**"
      - ".github/workflows/apk.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Python 3.11: python-for-android's build venv is broken on 3.14
      # (the kivy/buildozer image now ships 3.14 and fails at `pip -U pip`).
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: System dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            git zip unzip openjdk-17-jdk-headless \
            autoconf automake libtool pkg-config \
            zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 \
            cmake libffi-dev libssl-dev libltdl-dev

      - name: Install Buildozer
        run: |
          python -m pip install --upgrade pip
          python -m pip install "cython<3.0" buildozer

      - name: Build debug APK
        working-directory: noteapp
        run: |
          set -o pipefail
          buildozer -v android debug 2>&1 | tee build.log

      - name: Collect APK
        if: success()
        run: |
          mkdir -p out
          cp noteapp/bin/*.apk out/
          ls -lh out

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: pixnote-debug-apk
          path: out/*.apk
          if-no-files-found: error

      - name: Publish build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: buildozer-log
          path: noteapp/build.log
          if-no-files-found: ignore

      - name: Annotate failure
        if: failure()
        run: |
          LOG=noteapp/build.log
          if [ ! -f "$LOG" ]; then
            echo "::error title=Buildozer::no build.log was produced"
            exit 0
          fi
          MSG=$(tail -n 120 "$LOG" | sed 's/%/%25/g' | sed 's/\r//g' | awk '{printf "%s%%0A", $0}')
          echo "::error title=Buildozer log tail::$MSG"
